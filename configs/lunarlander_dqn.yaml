# DQN on LunarLander.
#   rlgames-sb train --config configs/lunarlander_dqn.yaml
#   rlgames-sb tune  --config configs/lunarlander_dqn.yaml
#
# Hyperparameters adapted from RL Baselines3 Zoo. A mean reward of 200+ counts
# as solved.

experiment: lunarlander
env: LunarLander-v3
algo: dqn
timesteps: 200_000
eval_episodes: 10

hyperparams:
  learning_rate: 6.3e-4
  batch_size: 128
  buffer_size: 50_000
  learning_starts: 0
  gamma: 0.99
  target_update_interval: 250
  train_freq: 4
  gradient_steps: -1
  exploration_fraction: 0.12
  exploration_final_eps: 0.1
  policy_kwargs:
    net_arch: [256, 256]
  # MLP policies are faster on the CPU; the GPU pays off for CNNs (Atari).
  device: cpu

tune:
  trials: 30
  timesteps: 100_000          # per seed
  seeds: 2                    # training runs per trial, averaged
  evals: 10                   # evaluations during each run
  eval_episodes: 5            # episodes per evaluation
  score_last: 3               # a run's score: mean of its last 3 evaluations
  search_space:
    learning_rate: {type: float, low: 1.0e-4, high: 1.0e-3, log: true}
    batch_size: {type: categorical, choices: [64, 128, 256]}
    target_update_interval: {type: categorical, choices: [250, 1000, 5000]}
    exploration_fraction: {type: float, low: 0.05, high: 0.3}
